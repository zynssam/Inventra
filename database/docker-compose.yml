services:
  postgres:
    image: postgres:16
    container_name: stocksense-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocksense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksense}
      POSTGRES_DB: ${POSTGRES_DB:-stocksense}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense"]
      interval: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4
    profiles: ["tools"]          # start with: docker compose --profile tools up
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stocksense.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
volumes:
  pgdata:
